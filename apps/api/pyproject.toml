[project]
name = "counterq-api"
version = "0.0.0"
description = "CounterQ FastAPI modular monolith foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.119.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.11.0",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.44",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.38.0"
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.1"
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
