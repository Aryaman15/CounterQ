name: counterq-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: counterq-postgres
    environment:
      POSTGRES_USER: counterq
      POSTGRES_PASSWORD: counterq
      POSTGRES_DB: counterq
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterq -d counterq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - counterq-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: counterq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - counterq-redis-data:/data

  execution-sandbox:
    build:
      context: ../execution-sandbox
    container_name: counterq-execution-sandbox
    read_only: true
    tmpfs:
      # The candidate binary must execute from the ephemeral workspace. The
      # read-only filesystem, dropped capabilities, internal network and
      # process/memory limits provide the remaining isolation boundaries.
      - /tmp:rw,exec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks:
      - sandbox

  execution-sandbox-proxy:
    image: nginx:1.27-alpine
    container_name: counterq-execution-sandbox-proxy
    depends_on:
      - execution-sandbox
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ../execution-sandbox/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox
      - execution-gateway

networks:
  sandbox:
    internal: true
  execution-gateway:

volumes:
  counterq-postgres-data:
  counterq-redis-data:
