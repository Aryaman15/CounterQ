name: counterq-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: counterq-postgres
    environment:
      POSTGRES_USER: counterq
      POSTGRES_PASSWORD: counterq
      POSTGRES_DB: counterq
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterq -d counterq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - counterq-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: counterq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - counterq-redis-data:/data

volumes:
  counterq-postgres-data:
  counterq-redis-data:

